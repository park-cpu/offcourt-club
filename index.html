<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1D5294" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Offcourt" />
    <title>Offcourt Club</title>
    <link rel="icon" href="assets/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main id="main"><div class="boot"><img src="assets/wordmark.png" alt="Offcourt" /></div></main>
    <nav id="tabbar" aria-label="주요 메뉴"></nav>
    <div id="sheets"></div>
    <script type="module" src="js/app.js"></script>
    <script>
      // 업데이트 직후 휴대폰에 예전 파일이 섞여 앱이 안 뜨면 → 새 파일로 다시 불러오기 안내
      setTimeout(function () {
        var main = document.getElementById('main');
        if (!main.querySelector('.boot')) return;
        main.innerHTML =
          '<div class="page"><div class="empty"><p>새 버전을 불러오는 중이에요.</p>' +
          '<button class="btn primary" id="hard-reload">새로고침</button></div></div>';
        document.getElementById('hard-reload').onclick = function () {
          var urls = performance.getEntriesByType('resource').map(function (e) { return e.name; })
            .filter(function (u) { return /\/(js|css)\//.test(u); });
          Promise.all(urls.map(function (u) { return fetch(u, { cache: 'reload' }).catch(function () {}); }))
            .then(function () { location.reload(); });
        };
      }, 8000);
    </script>
  </body>
</html>
